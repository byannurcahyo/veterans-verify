<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Veterans Verify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg: oklch(1 0 0);
        --fg: oklch(0.21 0.006 285.885);

        --primary: oklch(0.546 0.245 262.881);
        --primary-fg: oklch(1 0 0);

        --primary-subtle: oklch(0.623 0.214 259.815 / 0.15);
        --primary-subtle-fg: oklch(0.488 0.243 264.376);

        --secondary: oklch(0.92 0.004 286.32);
        --secondary-fg: oklch(0.141 0.005 285.823);

        --overlay: oklch(1 0 0);
        --overlay-fg: oklch(0.141 0.005 285.823);

        --accent: oklch(0.92 0.004 286.32);
        --accent-fg: oklch(0.141 0.005 285.823);

        --muted: oklch(0.967 0.001 286.375);
        --muted-fg: oklch(0.552 0.016 285.938);

        --success: oklch(0.596 0.145 163.225);
        --success-fg: oklch(1 0 0);

        --success-subtle: oklch(0.696 0.17 162.48 / 0.15);
        --success-subtle-fg: oklch(0.508 0.118 165.612);

        --info-subtle: oklch(0.685 0.169 237.323 / 0.15);
        --info-subtle-fg: oklch(0.5 0.134 242.749);

        --warning: oklch(0.828 0.189 84.429);
        --warning-fg: oklch(0.279 0.077 45.635);

        --warning-subtle: oklch(0.828 0.189 84.429 / 0.2);
        --warning-subtle-fg: oklch(0.555 0.163 48.998);

        --danger: oklch(0.577 0.245 27.325);
        --danger-fg: oklch(0.971 0.013 17.38);

        --danger-subtle: oklch(0.637 0.237 25.331 / 0.15);
        --danger-subtle-fg: oklch(0.505 0.213 27.518);

        --border: oklch(0.911 0.006 286.286);
        --input: oklch(0.871 0.006 286.286);
        --ring: oklch(0.546 0.245 262.881);

        --navbar: oklch(0.995 0 0);
        --navbar-fg: oklch(0.141 0.005 285.823);

        --sidebar: oklch(0.985 0 0);
        --sidebar-fg: oklch(0.141 0.005 285.823);
        --sidebar-primary: oklch(0.623 0.214 259.815 / 0.15);
        --sidebar-primary-fg: oklch(0.488 0.243 264.376);
        --sidebar-accent: oklch(0.92 0.004 286.32);
        --sidebar-accent-fg: oklch(0.141 0.005 285.823);
        --sidebar-border: oklch(0.901 0.006 286.286);
        --sidebar-ring: oklch(0.546 0.245 262.881);

        --chart-1: oklch(0.546 0.245 262.881);
        --chart-2: oklch(0.623 0.214 259.815);
        --chart-3: oklch(0.707 0.165 254.624);
        --chart-4: oklch(0.809 0.105 251.813);
        --chart-5: oklch(0.882 0.059 254.128);

        --radius-lg: 0.5rem;
        --radius-xs: calc(var(--radius-lg) * 0.5);
        --radius-sm: calc(var(--radius-lg) * 0.75);
        --radius-md: calc(var(--radius-lg) * 0.9);
        --radius-xl: calc(var(--radius-lg) * 1.25);
        --radius-2xl: calc(var(--radius-lg) * 1.5);
        --radius-3xl: calc(var(--radius-lg) * 2);
        --radius-4xl: calc(var(--radius-lg) * 3);
      }

      .dark {
        --bg: oklch(0.181 0.005 285.823);
        --fg: oklch(0.985 0 0);

        --primary: oklch(0.546 0.245 262.881);
        --primary-fg: oklch(1 0 0);

        --primary-subtle: oklch(0.623 0.214 259.815 / 0.1);
        --primary-subtle-fg: oklch(0.707 0.165 254.624);

        --secondary: oklch(0.244 0.006 286.033);
        --secondary-fg: oklch(0.985 0 0);

        --overlay: oklch(0.21 0.006 285.885);
        --overlay-fg: oklch(0.985 0 0);

        --accent: oklch(0.274 0.006 286.033);
        --accent-fg: oklch(0.985 0 0);

        --muted: oklch(0.21 0.006 285.885);
        --muted-fg: oklch(0.705 0.015 286.067);

        --success: oklch(0.596 0.145 163.225);
        --success-fg: oklch(1 0 0);

        --success-subtle: oklch(0.696 0.17 162.48 / 0.1);
        --success-subtle-fg: oklch(0.765 0.177 163.223);

        --info-subtle: oklch(0.685 0.169 237.323 / 0.1);
        --info-subtle-fg: oklch(0.828 0.111 230.318);

        --warning: oklch(0.828 0.189 84.429);
        --warning-fg: oklch(0.279 0.077 45.635);

        --warning-subtle: oklch(0.828 0.189 84.429 / 0.1);
        --warning-subtle-fg: oklch(0.828 0.189 84.429);

        --danger: oklch(0.577 0.245 27.325);
        --danger-fg: oklch(0.971 0.013 17.38);

        --danger-subtle: oklch(0.637 0.237 25.331 / 0.1);
        --danger-subtle-fg: oklch(0.704 0.191 22.216);

        --border: oklch(0.342 0.017 285.786);
        --input: oklch(0.32 0.013 285.805);
        --ring: oklch(0.546 0.245 262.881);

        --navbar: oklch(0.19 0.006 285.885);
        --navbar-fg: oklch(0.985 0 0);

        --sidebar: oklch(0.21 0.006 285.885);
        --sidebar-fg: oklch(0.985 0 0);
        --sidebar-primary: oklch(0.623 0.214 259.815 / 0.1);
        --sidebar-primary-fg: oklch(0.707 0.165 254.624);
        --sidebar-accent: oklch(0.274 0.006 286.033);
        --sidebar-accent-fg: oklch(0.985 0 0);
        --sidebar-border: oklch(0.274 0.006 286.033);
        --sidebar-ring: oklch(0.546 0.245 262.881);

        --chart-1: oklch(0.488 0.243 264.376);
        --chart-2: oklch(0.623 0.214 259.815);
        --chart-3: oklch(0.707 0.165 254.624);
        --chart-4: oklch(0.809 0.105 251.813);
        --chart-5: oklch(0.882 0.059 254.128);
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .title {
        font-size: 1.5rem;
        font-weight: 600;
        text-align: center;
        margin-bottom: 0.5rem;
      }
      
      .subtitle {
        text-align: center;
        color: var(--muted-fg);
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }

      .label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      .input {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--input);
        outline: none;
        transition: all 0.2s;
        font-size: 0.875rem;
      }

      .input:focus {
        border-color: var(--ring);
        box-shadow: 0 0 0 2px color-mix(in oklch, var(--ring) 20%, transparent);
      }

      .btn {
        width: 100%;
        padding: 0.75rem;
        background-color: var(--primary);
        color: var(--primary-fg);
        border-radius: var(--radius-md);
        font-weight: 500;
        transition: opacity 0.2s;
        margin-top: 1.5rem;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .error-alert {
        background-color: #fee2e2;
        color: #991b1b;
        padding: 0.75rem;
        border-radius: var(--radius-md);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body class="selection:bg-white/20">
    <div class="w-full max-w-[400px] p-6 lg:p-8">
      
      <!-- Logo/Brand -->
      <div class="flex flex-col items-center mb-8">
        <div class="h-10 w-10 bg-[var(--primary)] rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-white/5">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--primary-fg)]"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold tracking-tight">Veterans Verify</h1>
            <p class="text-sm text-[var(--muted-fg)]">Login with your administrator account</p>
        </div>
      </div>

      <!-- Card -->
      <div class="bg-[var(--overlay)] text-[var(--overlay-fg)] border border-[var(--border)] rounded-[var(--radius-2xl)] p-6 shadow-2xl backdrop-blur-sm">
        
        {% if error %}
        <div class="mb-6 p-3 rounded-lg bg-[var(--danger-subtle)] border border-[var(--danger)]/20 text-[var(--danger-fg)] text-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium text-[var(--muted-fg)]">Username</label>
            <input 
                type="text" 
                name="username" 
                class="w-full bg-[var(--muted)] border border-[var(--input)] rounded-[var(--radius-md)] px-3 py-2.5 text-sm text-[var(--fg)] placeholder:text-zinc-600 focus:outline-none focus:ring-2 focus:ring-[var(--ring)]/10 transition-all" 
                placeholder="admin"
                required 
                autocomplete="off" 
            />
          </div>
          <div class="space-y-2">
            <div class="flex items-center justify-between">
                <label class="text-sm font-medium text-[var(--muted-fg)]">Password</label>
            </div>
            <input 
                type="password" 
                name="password" 
                class="w-full bg-[var(--muted)] border border-[var(--input)] rounded-[var(--radius-md)] px-3 py-2.5 text-sm text-[var(--fg)] placeholder:text-zinc-600 focus:outline-none focus:ring-2 focus:ring-[var(--ring)]/10 transition-all" 
                required 
            />
          </div>
          
          <button 
            type="submit" 
            class="w-full bg-[var(--primary)] text-[var(--primary-fg)] font-medium text-sm py-2.5 rounded-[var(--radius-md)] hover:opacity-90 transition-colors shadow-lg shadow-white/5 active:scale-[0.98]"
          >
            Sign In
          </button>
        </form>
      </div>

      <p class="text-center text-xs text-[var(--muted-fg)] mt-8">
        &copy; 2026 Veterans Verify Console. All rights reserved.
      </p>
    </div>
  </body>
</html>
